<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Library</title><link rel="icon" href="{{ url_for('static', filename='images/icon.svg') }}"><link rel="stylesheet" href="{{ url_for('static', filename='styles/style1.css') }}"></head><body class="admin-login-body"><main class="admin-login-card"><a class="admin-brand" href="{{ url_for('index') }}"><span>L</span><div>Library<small>Админ-панель</small></div></a><h1>Вход</h1><p>Доступ к статистике и списку пользователей.</p>{% if configuration_missing %}<div class="admin-message error">Добавьте надёжный <code>ADMIN_PASSWORD</code> в файл <code>.env</code> и перезапустите сервер.</div>{% else %}{% if error %}<div class="admin-message error">{{ error }}</div>{% endif %}<form method="post" class="admin-login-form"><label for="password">Пароль администратора</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button class="admin-primary" type="submit">Войти</button></form><small class="admin-token-note">Сеанс действует 3 часа.</small>{% endif %}</main></body></html>
